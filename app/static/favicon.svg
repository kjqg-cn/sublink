<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="2" y1="2" x2="62" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="gloss" x1="8" y1="2" x2="46" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="upper-half">
      <rect x="0" y="0" width="64" height="32"/>
    </clipPath>
    <clipPath id="lower-half">
      <rect x="0" y="32" width="64" height="32"/>
    </clipPath>
    <mask id="cut-link1">
      <rect x="0" y="0" width="64" height="64" fill="#ffffff"/>
      <g clip-path="url(#upper-half)">
        <rect x="14.61" y="25.8" width="21.2" height="12.4" rx="6.2" stroke="#000000" stroke-width="8.6"/>
      </g>
    </mask>
    <mask id="cut-link2">
      <rect x="0" y="0" width="64" height="64" fill="#ffffff"/>
      <g clip-path="url(#lower-half)">
        <rect x="28.19" y="25.8" width="21.2" height="12.4" rx="6.2" stroke="#000000" stroke-width="8.6"/>
      </g>
    </mask>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#gloss)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
  <!-- Soft depth shadow -->
  <g transform="translate(0 1.5) rotate(-45 32 32)" stroke="#1e1b4b" stroke-opacity="0.22" stroke-width="5.6">
    <rect x="14.61" y="25.8" width="21.2" height="12.4" rx="6.2"/>
    <rect x="28.19" y="25.8" width="21.2" height="12.4" rx="6.2"/>
  </g>
  <!-- Interlocking chain links (true over/under weave) -->
  <g transform="rotate(-45 32 32)" stroke-width="5.3">
    <rect x="14.61" y="25.8" width="21.2" height="12.4" rx="6.2" stroke="#f0f7ff" mask="url(#cut-link2)"/>
    <rect x="28.19" y="25.8" width="21.2" height="12.4" rx="6.2" stroke="#ffffff" mask="url(#cut-link1)"/>
  </g>
</svg>
