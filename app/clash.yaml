mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
# 顶层启用 IPv6（允许直连纯 IPv6 节点及转发 IPv6 流量，避免 ip version error）
# Clash Mi 会覆写该配置，需自行设置【核心设置 → IPv6 → 启用 or 不覆写】
ipv6: true
external-controller: 127.0.0.1:9090

# 如客户端关闭了自带 DNS 覆写且需要解析域名 AAAA(IPv6) 记录，可按需取消下方 dns 注释：
# dns:
#   enable: true
#   ipv6: true
#   enhanced-mode: fake-ip
#   nameserver:
#     - 223.5.5.5
#     - 119.29.29.29

proxies:

proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - DIRECT
      - auto

  - name: ♻️ 自动选择
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - auto

  - name: 🤖 AI 服务
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - auto

  - name: 📲 电报信息
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - auto

  - name: 🌍 国外媒体
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🎯 全球直连
      - auto

  - name: Ⓜ️ 微软服务
    type: select
    proxies:
      - 🎯 全球直连
      - 🚀 节点选择
      - auto

  - name: 🍎 苹果服务
    type: select
    proxies:
      - 🎯 全球直连
      - 🚀 节点选择
      - auto

  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择

  - name: 🛑 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - 🎯 全球直连
      - ♻️ 自动选择
      - auto

rule-providers:
  private-domain:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs"
    path: ./ruleset/private-domain.mrs
    interval: 86400

  private-ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs"
    path: ./ruleset/private-ip.mrs
    interval: 86400

  ads:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs"
    path: ./ruleset/ads.mrs
    interval: 86400

  ai:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.mrs"
    path: ./ruleset/ai.mrs
    interval: 86400

  telegram-domain:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/telegram.mrs"
    path: ./ruleset/telegram-domain.mrs
    interval: 86400

  telegram-ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/telegram.mrs"
    path: ./ruleset/telegram-ip.mrs
    interval: 86400

  youtube:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/youtube.mrs"
    path: ./ruleset/youtube.mrs
    interval: 86400

  netflix:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/netflix.mrs"
    path: ./ruleset/netflix.mrs
    interval: 86400

  apple-cn:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple-cn.mrs"
    path: ./ruleset/apple-cn.mrs
    interval: 86400

  microsoft-cn:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft@cn.mrs"
    path: ./ruleset/microsoft-cn.mrs
    interval: 86400

  cn-domain:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs"
    path: ./ruleset/cn-domain.mrs
    interval: 86400

  cn-ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs"
    path: ./ruleset/cn-ip.mrs
    interval: 86400

  proxy-domain:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.mrs"
    path: ./ruleset/proxy-domain.mrs
    interval: 86400

rules:
  - RULE-SET,private-domain,🎯 全球直连
  - RULE-SET,private-ip,🎯 全球直连,no-resolve
  - RULE-SET,ads,🛑 广告拦截
  - RULE-SET,ai,🤖 AI 服务
  - RULE-SET,telegram-domain,📲 电报信息
  - RULE-SET,telegram-ip,📲 电报信息,no-resolve
  - RULE-SET,youtube,🌍 国外媒体
  - RULE-SET,netflix,🌍 国外媒体
  - RULE-SET,apple-cn,🍎 苹果服务
  - RULE-SET,microsoft-cn,Ⓜ️ 微软服务
  - RULE-SET,cn-domain,🎯 全球直连
  - RULE-SET,cn-ip,🎯 全球直连,no-resolve
  - RULE-SET,proxy-domain,🚀 节点选择
  - MATCH,🐟 漏网之鱼
