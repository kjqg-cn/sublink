services:
  sublink:
    build: .
    image: sublink:v3
    container_name: sublink-v3
    restart: always
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      - ./db:/app/app/db
    environment:
      - PORT=${PORT:-8000}
      - WORKERS=${WORKERS:-4}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - TRUSTED_PROXY_COUNT=${TRUSTED_PROXY_COUNT:-}
      - INIT_ADMIN_USERNAME=${INIT_ADMIN_USERNAME:-admin}
      - INIT_ADMIN_PASSWORD=${INIT_ADMIN_PASSWORD:-}
      - ENABLE_LOGIN_GEOIP=${ENABLE_LOGIN_GEOIP:-1}
